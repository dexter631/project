<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--Header 1-->
    <div class="logoip">
      <div class="logo-baar">
        <img src="./assets/Frame 2.png" alt="logoipm" width="177" height="41" />
      </div>
      <div class="search1">
        <img
          src="./assets/Search.png"
          alt="search bar"
          width="16"
          height="16"
        />
        <input placeholder="Search" />
      </div>
      <nav class="nav-bar">
        <a href="#" class="active">Products</a>
        <a>Services</a>
        <a>Expertise</a>
        <a>About</a>
      </nav>

      <button class="button-bar">Login / Signup</button>
    </div>

    <!--Header 2-->
    <div class="logotup">
      <img src="./assets/Wood.png" alt="logo" width="40" height="40" />

      <div class="homepage">
        <a href="#" class="active-2">Home</a>
        <a>About</a>
        <a>Market</a>
        <a>Services</a>
        <a>Blog</a>
      </div>

      <div class="search-baar">
        <img
          src="./assets/Buttons (1).png"
          alt="search"
          width="40"
          height="40"
        />
      </div>
      <div class="bag">
        <img src="./assets/Buttons.png" alt="shop" width="40" height="40" />
      </div>
      <div class="sign">
        <button>Sigh in</button>
      </div>
    </div>

    <!--Header 3-->
    <div class="leftPng">
      <img src="./assets/Left.png" alt="left" width="113.7" height="30" />

      <div class="buttons-3">
        <a>About</a>
        <a>Features</a>
        <a>Pricing</a>
        <a>Gallery</a>
        <a>Team</a>
      </div>

      <div class="search bar-3">
        <img src="./assets/Search.png" alt="search" width="24" height="24" />
      </div>
    </div>

    <!--Header 4-->

    <div class="leftPng-4">
      <img src="./assets/Left (1).png" alt="left" width="300" height="30" />
      <div class="buttons-4">
        <a>About</a>
        <a>Features</a>
        <a>Pricing</a>
        <a>Gallery</a>
        <a>Team</a>
      </div>
    </div>

    <!--Header 5-->

    <div class="leftPng-5">
      <img src="./assets/Logo.png" alt="left" width="113.7" height="30" />
      <div class="search-box">
        <input class="search-5" placeholder="Search..." />
        <img
          class="image-5"
          src="./assets/Icon.png"
          alt="search"
          width="24px"
          height="24px"
        />
      </div>

      <div class="buttons-5">
        <a>About</a>
        <a>Features</a>
        <a>Pricing</a>
        <a>Gallery</a>
        <a>Team</a>
      </div>
    </div>
