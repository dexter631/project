<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="submit" method="post">
      <label for="name">Имя пользователя:</label>
      <input type="text" id="name" name="name" required />

      <label for="name">Ваша электронная почта:</label>
      <input type="email" id="name" name="name" required />

      <label for="name">Введите пароль:</label>
      <input type="password" id="name" name="name" required />

      <label for="name">Введите комментарий:</label>
      <textarea id="message" name="message" rows="4" cols="50"></textarea>
    </form>

    <label for="country">County:</label>
    <select id="county" name="county" required>
      <option value="Россия">Россия</option>
      <option value="Китай">Китай</option>
      <option value="США">США</option>
    </select>
    <fieldset>
      <legend>buttons</legend>
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </fieldset>
  </body>
</html>
